name: " Bug Report"
description: Report a defect, unexpected behavior, or regression
title: "[BUG]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        Please provide as much detail as possible so the engineering team can quickly reproduce and resolve the issue.

  # --------------------------------------------------------------------------
  # Issue Detection Details
  # --------------------------------------------------------------------------
  - type: textarea
    id: issue_detection_details
    attributes:
      label: "Issue Detection Details"
      description: |
        Where and how was this issue discovered?
      placeholder: |
        Environment: Production / Staging / Local
        Browser: Chrome 125
        Device: MacBook Pro / Android / iPhone
        Account Type: Admin / User / Guest
        Version / Commit: v1.4.2
    validations:
      required: true

  # --------------------------------------------------------------------------
  # Steps to Reproduce
  # --------------------------------------------------------------------------
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "Provide clear numbered steps to reproduce the issue."
      placeholder: |
        1. Navigate to ...
        2. Click on ...
        3. Enter ...
        4. Observe the error ...
    validations:
      required: true

  # --------------------------------------------------------------------------
  # Observed vs Expected
  # --------------------------------------------------------------------------
  - type: textarea
    id: observed_vs_expected
    attributes:
      label: "Observed vs Expected Behavior"
      description: |
        Explain what actually happened and what should have happened instead.
      placeholder: |
        Observed:
        The modal remains open after clicking outside.

        Expected:
        The modal should close when clicking on the backdrop.
    validations:
      required: true

  # --------------------------------------------------------------------------
  # Affected Files
  # --------------------------------------------------------------------------
  - type: textarea
    id: affected_files
    attributes:
      label: "Affected Files / Components / APIs"
      description: |
        Mention impacted components, services, files, or endpoints.
      placeholder: |
        - src/components/LoginModal.tsx
        - src/utils/auth.js
        - /api/v1/auth/login
        - packages/ui/modal/*
    validations:
      required: false

  # --------------------------------------------------------------------------
  # Possible Solutions
  # --------------------------------------------------------------------------
  - type: textarea
    id: possible_solutions
    attributes:
      label: "Possible Solutions"
      description: |
        Share any technical hypothesis, suspected root cause, or possible fix.
      placeholder: |
        - Backdrop click event is not propagating correctly.
        - Missing state update after modal close action.
        - Regression introduced after PR #421.
    validations:
      required: false

  # --------------------------------------------------------------------------
  # Screenshots / Evidence
  # --------------------------------------------------------------------------
  - type: textarea
    id: screenshots_evidence
    attributes:
      label: "Screenshots / Evidence"
      description: |
        Attach screenshots, screen recordings, logs, stack traces, or console errors.
      placeholder: |
        Paste logs, screenshots, or links here.
    validations:
      required: false

  # --------------------------------------------------------------------------
  # Acceptance Criteria
  # --------------------------------------------------------------------------
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance Criteria"
      description: |
        Define what conditions must be met for this issue to be considered resolved.
      placeholder: |
        - Modal closes on backdrop click
        - No console errors
        - Unit tests updated and passing
        - Regression test added
    validations:
      required: true

  # --------------------------------------------------------------------------
  # Severity
  # --------------------------------------------------------------------------
  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  # --------------------------------------------------------------------------
  # Priority
  # --------------------------------------------------------------------------
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
